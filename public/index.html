<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Таро · рабочее место</title>
  <meta name="theme-color" content="#131019">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="favicon.svg">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <img class="brand-logo" src="logo.png" alt="Логотип Таро" width="44" height="44">
        <div>
          <div class="brand-title">Таро</div>
          <div class="brand-sub">рабочее место</div>
        </div>
      </div>

      <nav class="nav" id="nav" aria-label="Разделы"></nav>

      <div class="sidebar-foot">
        <div class="status-line">
          <span class="status-dot" id="status-dot"></span>
          <span id="status-text">проверка сервера…</span>
        </div>
        <div class="developer-row">
          <span class="developer">Разработчик: nbobrova</span>
          <button class="developer-mail" id="developer-mail" type="button"
                  title="Написать разработчику" aria-label="Написать разработчику">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"
                 aria-hidden="true" focusable="false">
              <rect x="3" y="5" width="18" height="14" rx="2"></rect>
              <path d="m3.5 6.5 8.5 6 8.5-6"></path>
            </svg>
          </button>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <h1 id="page-title">Обзор</h1>
        <p class="muted" id="page-subtitle"></p>
      </header>
      <section class="view" id="view"></section>
    </main>
  </div>

  <dialog class="feedback-dialog" id="feedback-dialog" aria-labelledby="feedback-title">
    <form class="form feedback-form" id="feedback-form" novalidate>
      <div class="feedback-head">
        <div>
          <h2 id="feedback-title">Сообщение разработчику</h2>
          <p class="muted feedback-sub">Баг, неточность или идея — сообщение сохранится в базе.</p>
        </div>
        <button class="icon-btn" type="button" id="feedback-close" aria-label="Закрыть">×</button>
      </div>

      <label><span>Тема<span class="req">*</span></span>
        <select name="topic">
          <option value="bug">Баг</option>
          <option value="inaccuracy">Неточность</option>
          <option value="suggestion">Предложение</option>
          <option value="other">Другое</option>
        </select>
      </label>

      <label><span>Что случилось или что хочется улучшить<span class="req">*</span></span>
        <textarea name="message" rows="7" maxlength="5000" required
                  placeholder="Опишите, что произошло, на какой странице и что вы ожидали увидеть"></textarea>
      </label>

      <p class="field-hint muted" id="feedback-page-hint"></p>
      <p class="form-error" id="feedback-error"></p>
      <p class="form-ok" id="feedback-ok" hidden>Сообщение сохранено. Спасибо!</p>

      <div class="form-actions">
        <button class="btn btn-primary" type="submit">Отправить</button>
        <button class="btn" type="button" id="feedback-cancel">Отмена</button>
      </div>
      <p class="feedback-view-all"><a href="#/feedback" id="feedback-view-all">Сохранённые сообщения →</a></p>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
